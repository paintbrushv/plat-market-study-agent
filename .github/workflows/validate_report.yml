name: validate-report

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest jsonschema

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Validate metrics schema
        run: |
          python -c "
          import json
          from pathlib import Path
          from jsonschema import Draft7Validator

          schema = json.loads(Path('prompts/metrics_schema.json').read_text())
          Draft7Validator.check_schema(schema)
          print('Schema valid')
          "
