name: nightly-refresh

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .

      - name: Pull public data
        run: |
          uv run python etl/ingest_bls.py 481910 --output data/public/processed/macro/bls_austin.parquet
          uv run python etl/ingest_census_permits.py 12420 --output data/public/processed/macro/permits_austin.parquet

      - name: Normalize datasets
        run: |
          uv run python etl/transform_normalize.py --inputs data/public/processed/macro/bls_austin.parquet data/public/processed/macro/permits_austin.parquet --output data/public/processed/metro/austin_metrics.parquet

      - name: Rebuild retrieval index
        run: |
          uv run python retrieval/indexer.py --inputs templates/**/*.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-refresh-assets
          path: |
            data/public/processed/**/*.parquet
            retrieval/stores/index_manifest.json
