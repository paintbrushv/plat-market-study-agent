[project]
name = "market-study-agent"
version = "0.1.0"
description = "Agent to produce expert-level multifamily market studies."
readme = "README.md"
authors = [
  { name = "Market Study Agent Team" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
    "duckdb>=1.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "xlrd>=2.0.2",
    # HTTP scraping: TLS fingerprint spoofing + headless browser
    "beautifulsoup4>=4.12",
    "curl-cffi>=0.7",
    "playwright>=1.44",
    "requests>=2.31",
    "jsonschema>=4.22",
    "scipy>=1.17.1",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "claude-agent-sdk>=0.1.68",
    "shapely>=2.0",
]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = []

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
(
  /data/public/raw/
  | /data/paid/
  | /retrieval/stores/
)
'''

[tool.ruff]
line-length = 100
src = ["agents", "etl", "retrieval", "prompts", "charts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]
fixable = ["I", "F401", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "."
exclude = "(^reports/|^reports\\\\)"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.2",
    "requests>=2.34.2",
    "ruff>=0.15.12",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.2",
    "requests>=2.34.2",
    "ruff>=0.15.12",
]
